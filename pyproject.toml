[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinking-bridge"
version = "0.1.0"
description = "Make Claude Fable 5.1's preserved-thinking rules observable and survivable when a conversation moves across Claude models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["anthropic", "claude", "thinking", "model-switching", "llm"]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["thinking_bridge"]
